<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>教育訓練報名系統</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { 
            background-image: url('https://images.unsplash.com/photo-1436491865332-7a61a109cc05?q=80&w=2074&auto=format&fit=crop'); 
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            padding: 20px; 
            font-family: '微軟正黑體', sans-serif; 
            position: relative;
            min-height: 100vh;
        }
        body::before {
            content: "";
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: rgba(0, 0, 0, 0.4); 
            z-index: -1;
        }
        .container { 
            max-width: 650px; 
            background: rgba(255, 255, 255, 0.95); 
            padding: 35px; 
            border-radius: 12px; 
            box-shadow: 0 8px 24px rgba(0,0,0,0.15); 
        }
        
        /* 👇 修正標題折行：加入響應式大小設定 */
        .main-title {
            font-weight: bold; 
            color: #2c3e50;
            font-size: 1.35rem; /* 手機版字體縮小，避免折行 */
        }
        @media (min-width: 576px) {
            .main-title { font-size: 1.75rem; } /* 電腦版恢復大字體 */
        }
        
        .form-label { font-weight: 600; color: #34495e; }
        .logo-img { max-height: 70px; display: block; margin: 0 auto 15px auto; }
        
        /* 卡片清單樣式 */
        .list-group-item input[type="radio"] { margin-top: 0.35rem; transform: scale(1.2); }
        .list-group-item:has(input[type="radio"]:checked) { background-color: #f0f7ff; border-color: #0d6efd; }
    </style>
  </head>
  <body>
    <div class="container">
      <img src="./logo.png" alt="公司Logo" class="logo-img" onerror="this.style.display='none'"> 
      
      <!-- 套用新的標題樣式 class="main-title" -->
      <h1 class="text-center mb-4 main-title">職業安全衛生教育訓練報名系統</h1>
      
      <form id="registrationForm" onsubmit="handleFormSubmit(event)">
        
        <div class="row">
            <div class="col-md-6 mb-3">
              <label class="form-label">航廈 *</label>
              <select name="terminal" class="form-select" required>
                <option value="">請選擇</option>
                <option value="第一航廈">第一航廈</option>
                <option value="第二航廈">第二航廈</option>
                <option value="其他">其他</option>
              </select>
            </div>
            <div class="col-md-6 mb-3">
              <label class="form-label">班別 *</label>
              <select name="shift" class="form-select" required>
                <option value="">請選擇</option>
                <option value="早班">早班</option>
                <option value="中班">中班</option>
                <option value="夜班">夜班</option>
                <option value="常日班">常日班</option>
              </select>
            </div>
        </div>

        <div class="row">
            <div class="col-md-6 mb-3">
              <label class="form-label">姓名 *</label>
              <input type="text" name="name" class="form-control" required>
            </div>
            <div class="col-md-6 mb-3">
              <label class="form-label">出生年月日 *</label>
              <input type="date" name="dob" class="form-control" required>
            </div>
        </div>

        <div class="mb-3">
          <label class="form-label">手機號碼 *</label>
          <input type="tel" name="phone" class="form-control" pattern="[0-9]{10}" placeholder="例如: 0912345678" required>
        </div>

        <div class="row">
            <div class="col-md-4 mb-3">
              <label class="form-label">學歷 *</label>
              <select name="education" class="form-select" required>
                <option value="">請選擇</option>
                <option value="國中(含)以下">國中(含)以下</option>
                <option value="高中/職">高中/職</option>
                <option value="專科">專科</option>
                <option value="大學">大學</option>
                <option value="碩士(含)以上">碩士(含)以上</option>
              </select>
            </div>
            <div class="col-md-4 mb-3">
              <label class="form-label">畢業學校 *</label>
              <input type="text" name="school" class="form-control" required>
            </div>
            <div class="col-md-4 mb-3">
              <label class="form-label">科系 / 主修 *</label>
              <input type="text" name="major" class="form-control" required>
            </div>
        </div>

        <div class="mb-4">
          <label class="form-label">地址 *</label>
          <input type="text" name="address" class="form-control" required>
        </div>

        <hr class="mb-4">

        <div class="mb-4">
          <label class="form-label d-block">選擇課程梯次 *</label>
          <div id="courseSelect" class="list-group shadow-sm border" style="max-height: 400px; overflow-y: auto;">
            <div class="list-group-item text-center text-muted py-4">課程資料自動載入中，請稍候...</div>
          </div>
        </div>

        <button type="submit" class="btn btn-primary w-100 py-2" id="submitBtn">提交報名資料</button>
      </form>
      <div id="resultMsg" class="mt-3 text-center" style="display:none;"></div>
    </div>

    <script>
      // ⚠️ 關鍵提醒：請務必將下方的中文替換為您的 Apps Script 網址 ⚠️
      const gasWebAppUrl = 'https://script.google.com/macros/s/AKfycbyNJSaDqOEBC0YicSYqyL6OpJcJTM21kh_6G8PhDsNDcG6t4Y6dSJi30mpZM7kHjwYw/exec'; 

      document.addEventListener('DOMContentLoaded', function() {
          const courseSelect = document.getElementById('courseSelect');
          
          fetch(gasWebAppUrl)
              .then(response => response.json())
              .then(data => {
                  courseSelect.innerHTML = ''; 
                  
                  data.forEach(function(course) {
                      const label = document.createElement('label');
                      label.className = 'list-group-item list-group-item-action d-flex gap-3 align-items-start py-3';
                      label.style.cursor = 'pointer';

                      let htmlContent = `
                        <input class="form-check-input flex-shrink-0" type="radio" name="course" value="${course.value}" required>
                        <div class="w-100">
                          <div class="fw-bold mb-2" style="font-size: 1.05rem; color: #1a1a1a;">${course.title}</div>
                          <div class="text-secondary" style="font-size: 0.9rem; line-height: 1.6;">
                            <div>🗓️ 上課日期：${course.date}</div>
                      `;

                      if (course.address) {
                        htmlContent += `<div>📍 上課地點：${course.address}</div>`;
                      }
                      if (course.note) {
                        htmlContent += `<div class="mt-1 text-primary">💡 ${course.note}</div>`;
                      }

                      htmlContent += `
                          </div>
                        </div>
                      `;

                      label.innerHTML = htmlContent;
                      courseSelect.appendChild(label);
                  });
              })
              .catch(error => {
                  console.error("讀取課程失敗:", error);
                  courseSelect.innerHTML = '<div class="list-group-item text-center text-danger py-4">課程載入失敗，請檢查網址設定或網路連線</div>';
              });
      });

      function handleFormSubmit(event) {
          event.preventDefault();
          
          const submitBtn = document.getElementById('submitBtn');
          const form = document.getElementById('registrationForm');
          const msgDiv = document.getElementById('resultMsg');
          
          submitBtn.disabled = true;
          submitBtn.innerText = '資料傳送中...';
          
          const formData = new FormData(form);
          const formObject = {};
          formData.forEach((value, key) => { formObject[key] = value; });

          fetch(gasWebAppUrl, {
            method: 'POST',
            body: JSON.stringify(formObject),
            headers: { 'Content-Type': 'text/plain;charset=utf-8' }
          })
          .then(response => response.json())
          .then(data => {
            msgDiv.style.display = 'block';
            
            if(data.result === 'success') {
              // 👇 報名成功後隱藏表單，顯示完成畫面並嘗試關閉網頁
              form.style.display = 'none';
              submitBtn.style.display = 'none';
              
              msgDiv.innerHTML = `
                <div class="alert alert-success text-center py-5 shadow-sm" style="border-radius: 12px; background-color: #d1e7dd; border: 1px solid #badbcc;">
                  <h3 class="fw-bold mb-3" style="color: #0f5132;">🎉 報名成功！</h3>
                  <p class="fs-5" style="color: #0f5132;">您的資料已安全建檔。</p>
                  <hr class="my-4" style="border-color: #badbcc;">
                  <p class="mb-0 text-muted fw-bold">您現在可以安全地關閉此網頁了。</p>
                  <p class="text-muted small mt-2">(視窗將嘗試自動關閉...)</p>
                </div>
              `;
              
              setTimeout(() => {
                window.opener = null;
                window.open('', '_self');
                window.close();
              }, 3000);
              
            } else {
              msgDiv.innerHTML = '<div class="alert alert-danger">系統錯誤：' + data.message + '</div>';
              submitBtn.disabled = false;
              submitBtn.innerText = '提交報名資料';
            }
          })
          .catch(error => {
            msgDiv.style.display = 'block';
            msgDiv.innerHTML = '<div class="alert alert-danger">網路連線錯誤，請稍後再試。</div>';
            submitBtn.disabled = false;
            submitBtn.innerText = '提交報名資料';
          });
      }
    </script>
  </body>
</html>
