<script>
  function handleFormSubmit(event) {
    event.preventDefault();
    
    var submitBtn = document.getElementById('submitBtn');
    submitBtn.disabled = true;
    submitBtn.innerText = '資料傳送中...';
    
    var form = document.getElementById('registrationForm');
    var formData = new FormData(form);
    var formObject = {};
    formData.forEach(function(value, key){
        formObject[key] = value;
    });

    // 替換成您剛剛在 GAS 重新部署後取得的 Web App 網址
    var gasWebAppUrl = 'https://script.google.com/macros/s/AKfycbyNJSaDqOEBC0YicSYqyL6OpJcJTM21kh_6G8PhDsNDcG6t4Y6dSJi30mpZM7kHjwYw/exec';
    
    // 使用 fetch 傳送資料到 GAS
    fetch(gasWebAppUrl, {
      method: 'POST',
      body: JSON.stringify(formObject),
      headers: {
        'Content-Type': 'text/plain;charset=utf-8' // 避免 CORS 預檢請求
      }
    })
    .then(response => response.json())
    .then(data => {
      var msgDiv = document.getElementById('resultMsg');
      msgDiv.style.display = 'block';
      if(data.result === 'success') {
        msgDiv.innerHTML = '<div class="alert alert-success">報名成功！您的資料已安全建檔。</div>';
        form.reset();
      } else {
        msgDiv.innerHTML = '<div class="alert alert-danger">系統錯誤：' + data.message + '</div>';
      }
      submitBtn.disabled = false;
      submitBtn.innerText = '提交報名資料';
    })
    .catch(error => {
      var msgDiv = document.getElementById('resultMsg');
      msgDiv.style.display = 'block';
      msgDiv.innerHTML = '<div class="alert alert-danger">網路連線錯誤，請稍後再試。</div>';
      submitBtn.disabled = false;
      submitBtn.innerText = '提交報名資料';
    });
  }
</script>
