<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>教育訓練報名系統</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { 
            /* 👇 替換為您的背景圖檔名，若您上傳的檔名不同請在此修改 */
            background-image: url('./bg.jpg'); 
            
            /* 若您還沒上傳圖片，可以先暫時用這張航空主題的測試圖，請將上方那行刪除，改用下方這行： */
            /* background-image: url('https://images.unsplash.com/photo-1436491865332-7a61a109cc05?q=80&w=2074&auto=format&fit=crop'); */
            
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            padding: 20px; 
            font-family: '微軟正黑體', sans-serif; 
            position: relative;
            min-height: 100vh;
        }

        body { 
            /* 👇 這裡已經幫您替換成線上高畫質的飛機圖片網址 */
            background-image: url('https://images.unsplash.com/photo-1436491865332-7a61a109cc05?q=80&w=2074&auto=format&fit=crop'); 
            
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            padding: 20px; 
            font-family: '微軟正黑體', sans-serif; 
            position: relative;
            min-height: 100vh;
        }

        /* 增加半透明黑色遮罩，凸顯白色的報名表單 */
        body::before {
            content: "";
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: rgba(0, 0, 0, 0.4); 
            z-index: -1;
        }

        .container { 
            max-width: 650px; 
            background: rgba(255, 255, 255, 0.95); /* 表單微透明設計 */
            padding: 35px; 
            border-radius: 12px; 
            box-shadow: 0 8px 24px rgba(0,0,0,0.15); 
        }
        h2 { font-weight: bold; color: #2c3e50; }
        .form-label { font-weight: 600; color: #34495e; }
        
        /* Logo 圖片樣式設定 */
        .logo-img {
            max-height: 80px; /* 限制 Logo 高度，避免佔據太大版面 */
            display: block;
            margin: 0 auto 20px auto; /* 圖片置中並與下方標題保持距離 */
        }
    </style>
  </head>
  <body>
    <div class="container">
      
      <!-- 👇 替換為您的 Logo 圖檔名，若您上傳的檔名不同請在此修改 -->
      <img src="./logo.png" alt="公司Logo" class="logo-img" onerror="this.style.display='none'"> 
      
      <h2 class="text-center mb-4">職業安全衛生教育訓練報名系統</h2>
      <form id="registrationForm" onsubmit="handleFormSubmit(event)">
        
        <div class="row">
            <div class="col-md-6 mb-3">
              <label class="form-label">航廈 *</label>
              <select name="terminal" class="form-select" required>
                <option value="">請選擇</option>
                <option value="第一航廈">第一航廈</option>
                <option value="第二航廈">第二航廈</option>
              </select>
            </div>
    
            <div class="col-md-6 mb-3">
              <label class="form-label">班別 *</label>
              <select name="shift" class="form-select" required>
                <option value="">請選擇</option>
                <option value="早班">早班</option>
                <option value="中班">中班</option>
                <option value="夜班">夜班</option>
              </select>
            </div>
        </div>

        <div class="row">
            <div class="col-md-6 mb-3">
              <label class="form-label">姓名 *</label>
              <input type="text" name="name" class="form-control" required>
            </div>
    
            <div class="col-md-6 mb-3">
              <label class="form-label">出生年月日 *</label>
              <input type="date" name="dob" class="form-control" required>
            </div>
        </div>

        <div class="mb-3">
          <label class="form-label">手機號碼 *</label>
          <input type="tel" name="phone" class="form-control" pattern="[0-9]{10}" placeholder="例如: 0912345678" required>
        </div>

        <div class="row">
            <div class="col-md-6 mb-3">
              <label class="form-label">學歷 *</label>
              <select name="education" class="form-select" required>
                <option value="">請選擇</option>
                <option value="國中(含)以下">國中(含)以下</option>
                <option value="高中/職">高中/職</option>
                <option value="專科">專科</option>
                <option value="大學">大學</option>
                <option value="碩士(含)以上">碩士(含)以上</option>
              </select>
            </div>
    
            <div class="col-md-6 mb-3">
              <label class="form-label">畢業學校 *</label>
              <input type="text" name="school" class="form-control" required>
            </div>
        </div>

        <div class="mb-4">
          <label class="form-label">地址 *</label>
          <input type="text" name="address" class="form-control" required>
        </div>

        <hr class="mb-4">

        <div class="mb-4">
          <label class="form-label">選擇課程梯次 *</label>
          <select name="course" id="courseSelect" class="form-select" required>
            <option value="">課程資料自動載入中，請稍候...</option>
          </select>
        </div>

        <button type="submit" class="btn btn-primary w-100 py-2" id="submitBtn">提交報名資料</button>
      </form>
      <div id="resultMsg" class="mt-3 text-center" style="display:none;"></div>
    </div>

    <script>
      // 請將這裡替換為您剛剛「新增部署」取得的最新 GAS 網址
    var gasWebAppUrl = 'https://script.google.com/macros/s/AKfycbyNJSaDqOEBC0YicSYqyL6OpJcJTM21kh_6G8PhDsNDcG6t4Y6dSJi30mpZM7kHjwYw/exec'; 

    // 當網頁一打開時，自動執行以下動作抓取課程
    document.addEventListener('DOMContentLoaded', function() {
        var courseSelect = document.getElementById('courseSelect');
        
        fetch(gasWebAppUrl)
            .then(response => response.json())
            .then(data => {
                // 清空「載入中」的字眼
                courseSelect.innerHTML = '<option value="">請展開選擇您要報名的場次</option>';
                
                // 把試算表抓回來的資料一筆一筆塞進下拉式選單
                data.forEach(function(course) {
                    var option = document.createElement('option');
                    option.value = course;
                    option.textContent = course;
                    courseSelect.appendChild(option);
                });
            })
            .catch(error => {
                console.error("讀取課程失敗:", error);
                courseSelect.innerHTML = '<option value="">課程載入失敗，請檢查網路後重新整理</option>';
            });
    });
     
      function handleFormSubmit(event) {
        event.preventDefault();
        
        var submitBtn = document.getElementById('submitBtn');
        submitBtn.disabled = true;
        submitBtn.innerText = '資料傳送中...';
        
        var form = document.getElementById('registrationForm');
        var formData = new FormData(form);
        var formObject = {};
        formData.forEach(function(value, key){
            formObject[key] = value;
        });

        // ⚠️ 提醒：請務必將下方的網址替換回您自己的 Apps Script Web App URL ⚠️
        var gasWebAppUrl = 'https://script.google.com/macros/s/AKfycbyNJSaDqOEBC0YicSYqyL6OpJcJTM21kh_6G8PhDsNDcG6t4Y6dSJi30mpZM7kHjwYw/exec'; 
        
        fetch(gasWebAppUrl, {
          method: 'POST',
          body: JSON.stringify(formObject),
          headers: {
            'Content-Type': 'text/plain;charset=utf-8' 
          }
        })
        .then(response => response.json())
        .then(data => {
          var msgDiv = document.getElementById('resultMsg');
          msgDiv.style.display = 'block';
          if(data.result === 'success') {
            msgDiv.innerHTML = '<div class="alert alert-success">報名成功！您的資料已安全建檔。</div>';
            form.reset();
          } else {
            msgDiv.innerHTML = '<div class="alert alert-danger">系統錯誤：' + data.message + '</div>';
          }
          submitBtn.disabled = false;
          submitBtn.innerText = '提交報名資料';
        })
        .catch(error => {
          var msgDiv = document.getElementById('resultMsg');
          msgDiv.style.display = 'block';
          msgDiv.innerHTML = '<div class="alert alert-danger">網路連線錯誤，請稍後再試。</div>';
          submitBtn.disabled = false;
          submitBtn.innerText = '提交報名資料';
        });
      }
    </script>
  </body>
</html>
